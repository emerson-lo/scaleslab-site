<style>
:root{--font-display:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;--accent:#E2382F;--tint:#FAFAF8;
  --ease-out:cubic-bezier(0.23, 1, 0.32, 1)}
body{margin:0;background:var(--tint);color:rgba(0,0,0,0.85);font-family:'Helvetica Neue',Helvetica,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
a{color:rgba(0,0,0,0.85)}a:hover{color:#000000}
button{font:inherit}
img{max-width:100%}
[hidden]{display:none !important}

/* Header, as on the homepage: frosted glass over the photo, uppercase links, red social icons. */
.sla-bar{-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8)}
header nav[aria-label="Primary"] > a{text-transform:uppercase;letter-spacing:.12em;font-size:13px}
.sla-social a{transition:opacity .18s ease}
.sla-social a:hover{opacity:.6}

/* Phone menu, as on the homepage. */
.sla-menu{-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);opacity:0;transition:opacity 160ms ease-out}
.sla-menu.is-open{opacity:1;transition-duration:240ms}
.sla-menu__nav{display:flex;flex-direction:column}
.sla-menu__nav a{display:flex;align-items:center;min-height:64px;font-size:32px;letter-spacing:-.02em;color:#FFFFFF;
  text-decoration:none;border-bottom:1px solid rgba(255,255,255,.16)}
.sla-menu__foot{margin-top:auto;display:flex;flex-direction:column;font-size:15px;line-height:1.5;color:rgba(255,255,255,.82)}
.sla-menu__foot > a{display:flex;align-items:center;min-height:48px;color:inherit;text-decoration:none}
.sla-menu__social{display:flex;gap:8px;margin:8px 0 0 -10px}
.sla-menu__social a{display:flex;align-items:center;justify-content:center;width:44px;height:44px}
.sla-menu > div:first-child,.sla-menu__nav a,.sla-menu__foot{opacity:0;transform:translateY(10px);transition:opacity 140ms ease-out,transform 160ms ease-out}
.sla-menu.is-open > div:first-child,.sla-menu.is-open .sla-menu__nav a,.sla-menu.is-open .sla-menu__foot{opacity:1;transform:none;
  transition:opacity 260ms ease-out,transform 420ms var(--ease-out)}
.sla-menu.is-open .sla-menu__nav a:nth-child(1){transition-delay:40ms}
.sla-menu.is-open .sla-menu__nav a:nth-child(2){transition-delay:75ms}
.sla-menu.is-open .sla-menu__nav a:nth-child(3){transition-delay:110ms}
.sla-menu.is-open .sla-menu__nav a:nth-child(4){transition-delay:145ms}
.sla-menu.is-open .sla-menu__foot{transition-delay:180ms}

/* Message: a full-screen photo behind the header, the same dark gradient as the homepage hero. */
.ty{position:relative;overflow:hidden;height:100vh;height:100svh;margin-top:calc(-1 * var(--bar-h,96px));background:#0E0F16;color:#FFFFFF}
.ty__photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.06);animation:ty-zoom 9s linear forwards}
@keyframes ty-zoom{to{transform:scale(1)}}
.ty__scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,15,22,0.10) 0%,rgba(14,15,22,0.28) 55%,rgba(14,15,22,0.72) 100%)}
.ty__body{position:absolute;left:clamp(20px,3vw,40px);right:clamp(20px,3vw,40px);bottom:clamp(24px,4vw,48px);
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px 40px}
.ty__text{display:flex;flex-direction:column;gap:14px;max-width:640px;opacity:0;transform:translateY(12px);
  animation:ty-in 600ms var(--ease-out) 120ms forwards}
.ty__title{margin:0;font-family:var(--font-display);font-size:clamp(44px,6vw,88px);line-height:1.02;font-weight:400;letter-spacing:-.035em}
.ty__lede{margin:0;font-size:clamp(16px,1.4vw,19px);line-height:1.6;color:rgba(255,255,255,.86)}
@keyframes ty-in{to{opacity:1;transform:none}}

/* Liquid glass, as on the homepage hero button. */
.lg{color:#FFFFFF;border-radius:6px;background:rgba(22,22,22,.22);
  -webkit-backdrop-filter:blur(14px) saturate(1.7);backdrop-filter:blur(14px) saturate(1.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.24),0 14px 36px rgba(0,0,0,.18)}
@supports (backdrop-filter:url(#gh-liquid)){ .lg{backdrop-filter:url(#gh-liquid) blur(10px) saturate(1.7)} }
.ty__back{flex:none;display:inline-flex;align-items:center;gap:12px;min-height:46px;padding:0 22px;font-size:15px;font-weight:500;
  letter-spacing:.01em;text-decoration:none;white-space:nowrap;color:#FFFFFF;opacity:0;animation:ty-in 600ms var(--ease-out) 220ms forwards;
  transition:background-color .18s ease,transform 160ms var(--ease-out)}
.ty__back:hover{color:#FFFFFF}
.ty__back:active{transform:scale(.97)}
.ty__arrow{display:flex;color:var(--accent);transition:transform .25s var(--ease-out)}
@media (hover:hover) and (pointer:fine){
  .ty__back:hover{background:rgba(255,255,255,.22)}
  .ty__back:hover .ty__arrow{transform:translateX(-3px)}
}
.ty__back:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}

/* Footer: just the name and year, centred. */
.ty-foot{background:var(--tint)}
.sla-copyright{margin:0;padding:22px 0;text-align:center;font-size:11px;line-height:1.4;
  letter-spacing:.18em;text-indent:.18em;text-transform:uppercase;color:#737373}

@media (prefers-reduced-motion:reduce){
  .ty__photo{animation:none;transform:none}
  .ty__text,.ty__back{animation:none;opacity:1;transform:none}
  .sla-menu > div:first-child,.sla-menu__nav a,.sla-menu__foot{transform:none !important;transition-delay:0ms !important}
}

@media (max-width:700px){
  .sla-bar > div{padding:10px 10px 10px 20px !important}
  .sla-bar > div > div{width:100%;flex-direction:row-reverse;justify-content:space-between}

  .sla-menu > div:first-child{min-height:44px;margin-right:-10px}
  .ty__photo{object-position:50% 50%}
  .ty__body{left:20px;right:20px;bottom:24px;flex-direction:column;align-items:stretch;gap:24px}
  .ty__title{font-size:clamp(40px,12vw,56px)}
  .ty__back{justify-content:space-between;min-height:52px;padding:0 18px}
  .sla-copyright{padding:16px 0;font-size:9px;letter-spacing:.16em;text-indent:.16em}
}

<script>
(function () {
  // The photo slides up behind the sticky header by exactly the header's height.
  var bar = document.querySelector('.sla-bar');
  function setBar() { if (bar) document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px'); }
  setBar();
  window.addEventListener('resize', setBar);

  // Phone menu: fade in and out, hold the page still while open, move focus in and back.
  var menu = document.getElementById('sla-menu'), opener = document.querySelector('.sla-menu-btn'), open = false, t = null;
  function setMenu(next) {
    if (!menu || open === next) return;
    open = next;
    clearTimeout(t);
    if (open) { menu.hidden = false; void menu.offsetWidth; menu.classList.add('is-open'); }
    else { menu.classList.remove('is-open'); t = setTimeout(function () { if (!open) menu.hidden = true; }, 200); }
    document.body.style.overflow = open ? 'hidden' : '';
    if (opener) opener.setAttribute('aria-expanded', open ? 'true' : 'false');
    var to = open ? menu.querySelector('[data-action="close-menu"]') : opener;
    if (to) to.focus({ preventScroll: true });
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-action]');
    if (!a) return;
    if (a.getAttribute('data-action') === 'open-menu') setMenu(true);
    if (a.getAttribute('data-action') === 'close-menu') setMenu(false);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
  var phone = window.matchMedia('(max-width: 700px)');
  (phone.addEventListener ? phone.addEventListener.bind(phone, 'change') : phone.addListener.bind(phone))(function () { if (!phone.matches) setMenu(false); });
})();
</script>
